# Upptime configuration for the public status page (repo cronpulser/status).
# Copy this file's content into .upptimerc.yml in that repo, replacing the
# template's file. Checks run every 5 minutes on GitHub Actions; a site is
# "down" when it does not answer 200. The API check uses /health, which
# returns 503 when the scheduler, queue, workers or database are unhealthy.
owner: cronpulser
repo: status

sites:
  - name: Scheduler and API
    url: https://api.cronpulser.com/health
  - name: App
    url: https://app.cronpulser.com/
  - name: Website
    url: https://cronpulser.com/

assignees:
  - cronpulser

status-website:
  cname: status.cronpulser.com
  logoUrl: https://cronpulser.com/favicon.svg
  name: CronPulser Status
  introTitle: "CronPulser service status"
  introMessage: >-
    Live status and uptime history of the CronPulser scheduler, app and
    website. Checked every 5 minutes from GitHub, outside our own servers.
  navbar:
    - title: Status
      href: /
    - title: CronPulser
      href: https://cronpulser.com/
    - title: Help
      href: https://app.cronpulser.com/?support=1
